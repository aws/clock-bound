[package]
name = "clock-bound"
description = "A crate to provide error bounded timestamp intervals."
license = "MIT OR Apache-2.0"
readme = "../README.md"

authors.workspace = true
categories.workspace = true
edition = "2024"
exclude.workspace = true
keywords.workspace = true
publish = true
repository.workspace = true
version.workspace = true

[dependencies]
bon = { version = "3.8.0" }
byteorder = "1"
bytes = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4.5.50", features = ["derive"], optional = true }
errno = { version = "0.3.0", default-features = false }
libc = { version = "0.2", default-features = false, features = [
  "extra_traits",
] }
md5 = "0.8.0"
nix = { version = "0.26" }
nom = { version = "8", optional = true }
reqwest = { version = "0.12.24", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = "1.0.145"
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.47.1", features = [
  "fs",
  "net",
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
], optional = true }
tokio-util = { version = "0.7.17", features = ["rt"], optional = true }
tracing = "0.1"
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "std",
  "fmt",
  "json",
  "registry",
] }
futures = "0.3"
rand = "0.9.2"
tokio-retry = "0.3"

[dev-dependencies]
approx = "0.5"
hex-literal = "0.4"
mockall = "0.13.1"
mockall_double = "0.3.1"
rstest = "0.26"
tempfile = "3.13"
tokio = { version = "1.47.1", features = [
  "fs",
  "net",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "test-util",
] }
tracing-test = "0.2.5"

[features]
client = []

daemon = [
  "dep:clap",
  "dep:serde",
  "dep:tokio",
  "dep:tokio-util",
  "dep:chrono",
  "dep:bytes",
  "dep:nom",
  "dep:reqwest",
  "dep:thiserror",
  "dep:tracing-appender",
  "nix/feature",
  "nix/ioctl",
  "nix/time",
  "tracing-subscriber/env-filter",
]
algorithm = [
  "dep:serde",
  "dep:thiserror",
  "dep:tracing-appender",
  "tracing-subscriber/env-filter",
] # clock sync algorithm only, no daemon I/O or clock adjustment
test-side-by-side = [
] # run without changing system clock. And compare against system clock
time-string-parse = ["dep:nom"]

default = ["client"]

[[bin]]
name = "clockbound"
required-features = ["daemon"]

[[bin]]
name = "cbctl"
path = "src/bin/cbctl/main.rs"
required-features = ["client", "daemon"]

[package.metadata.generate-rpm]
name = "clockbound"
assets = [
  { source = "target/release/clockbound", dest = "/usr/bin/clockbound", mode = "755" },
  { source = "target/release/cbctl", dest = "/usr/bin/cbctl", mode = "755" },
  { source = "assets/clockbound.service", dest = "/usr/lib/systemd/system/clockbound.service", mode = "644" },
  { source = "assets/configure_phc", dest = "/usr/sbin/configure_phc", mode = "755" },
]

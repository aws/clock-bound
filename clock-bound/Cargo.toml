[package]
name = "clock-bound"
description = "A crate to provide error bounded timestamp intervals."
license = "MIT OR Apache-2.0"

authors.workspace = true
categories.workspace = true
edition = "2024"
exclude.workspace = true
keywords.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
bon = { version = "3.8.0", optional = true }
byteorder = "1"
bytes = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
errno = { version = "0.3.0", default-features = false }
libc = { version = "0.2", default-features = false, features = [
  "extra_traits",
] }
nix = { version = "0.26", features = ["feature", "time"] }
nom = { version = "8", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.47.1", features = [
  "fs",
  "net",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt", "json"] }

[dev-dependencies]
approx = "0.5"
hex-literal = "0.4"
mockall = "0.13.1"
rstest = "0.26"
tempfile = "3.13"

[features]
client = []
daemon = [
  "dep:bon",
  "dep:serde",
  "dep:tokio",
  "dep:chrono",
  "dep:bytes",
  "dep:nom",
  "dep:thiserror",
  "tracing-subscriber/env-filter",
]
time-string-parse = ["dep:nom"]

default = ["client", "daemon"]

[[bin]]
name = "clockbound"
required-features = ["daemon"]

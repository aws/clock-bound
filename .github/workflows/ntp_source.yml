name: NTP Source

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo build
        run: cargo build --bin ntp-source-test --release

      - name: Upload ntp-source-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntp-source-test
          path: target/release/ntp-source-test

  NTP_Source_Tests:
    name: NTP Source tests
    needs: build
    runs-on:
      - codebuild-StagingClockBound-${{ github.run_id }}-${{ github.run_attempt }}
        buildspec-override:true

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v5
        with:
          name: ntp-source-test

      - run: ls
      - run: echo "Change permissions of artifact."
      - run: chmod 755 ntp-source-test
      - run: echo "Run ntp source test!"
      - run: ./ntp-source-test
name: pr_comment_slack
permissions:
  contents: read

on:
  issue_comment:
    types: [created]

jobs:
  pr_comment_slack:
    if: contains(github.event.comment.html_url, '/pull/') # only execute on pull_requests
    name: Notify slack of pull request comment
    runs-on: ubuntu-latest
    steps:
      - name: Send comment info to slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          payload-delimiter: "_"
          webhook: ${{ secrets.PR_COMMENT_WEBHOOK_URL }}
          webhook-type: webhook-trigger

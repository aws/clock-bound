name: ClockBound SHM Validation

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run daily at 9am EST (14:00 UTC)
    - cron: '0 14 * * *'

jobs:
  build:
    name: Build shmv3-error-bound-validation + clockbound
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build shmv3-error-bound-validation binary
        run: cargo build --bin shmv3-error-bound-validation --release

      - name: Build clockbound binary
        run: cargo build --bin clockbound --features "daemon,test-side-by-side" --release

      - name: Upload shmv3-error-bound-validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: shmv3-error-bound-validation
          path: target/release/shmv3-error-bound-validation

      - name: Upload clockbound artifact
        uses: actions/upload-artifact@v4
        with:
          name: clockbound
          path: target/release/clockbound

  shm-validation:
    name: SHM V3 Validation
    needs: build
    runs-on:
      - codebuild-${{ vars.PHC_X86_FLEET }}-${{ github.run_id }}-${{ github.run_attempt }}
        buildspec-override:true

    steps:
      - name: Set primer log directory
        id: logdir
        run: |
          LOG_DIR="/tmp/clockbound-primer-logs/$(date +%Y%m%d-%H%M%S)-${{ github.run_id }}"
          echo "PRIMER_LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"
          echo "dir=$LOG_DIR" >> "$GITHUB_OUTPUT"
          mkdir -p "$LOG_DIR"

      - name: Download shmv3-error-bound-validation artifact
        uses: actions/download-artifact@v4
        with:
          name: shmv3-error-bound-validation

      - name: Download clockbound artifact
        uses: actions/download-artifact@v4
        with:
          name: clockbound

      - name: Set permissions
        run: |
          chmod 755 shmv3-error-bound-validation
          chmod 755 clockbound

      - name: Verify chrony
        run: |
          TRACKING=$(chronyc tracking 2>&1 || true)
          if echo "$TRACKING" | grep -q 'PHC0'; then
            echo "chrony is running with the PHC as a reference"
          else
            echo "chrony not running (or is not syncing to the PHC), adding PHC reflock to chrony config and restarting..."
            sudo sed -i '1i refclock PHC /dev/ptp_ena poll 0 delay 0.000010 prefer' /etc/chrony.conf
            sudo service chronyd restart
            # With poll 0 (1s interval), chrony gets one sample each second.
            # Sleep 10s to allow convergence before verifying.
            # The test warmup period (--warmup-secs) provides additional convergence time.
            sleep 10
            TRACKING=$(chronyc tracking 2>&1)
            if echo "$TRACKING" | grep -q 'PHC0'; then
              echo "chrony is now tracking the PHC"
            else
              echo "ERROR: chrony did not select the PHC after restart"
              echo "$TRACKING"
              exit 1
            fi
          fi

      - name: Write clockbound configuration
        run: |
          cat > /tmp/clockbound.toml <<EOF
          [logging]
          log_directory = "$PRIMER_LOG_DIR"

          [logging.synchronization]
          enabled = true

          [logging.ffevents]
          enabled = true
          EOF

      - name: Start clockbound
        run: |
          sudo ./clockbound -c /tmp/clockbound.toml &
          echo $! > /tmp/clockbound.pid

      - name: Run SHM validation test
        run: |
          ./shmv3-error-bound-validation \
            --sampling-loop-duration 300 \
            --warmup-secs 10 \
            --sample-interval-ms 250 \
            --output-path shmv3_error_bound_validation_results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shmv3-validation-results-${{ github.run_id }}
          path: shmv3_error_bound_validation_results.json

      - name: Upload clockbound logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clockbound-logs-${{ github.run_id }}
          path: ${{ steps.logdir.outputs.dir }}/

      # Belt and suspenders cleanup. Not critical in our current ephemeral
      # CodeBuild environment, but prevents leaks if we move to persistent runners.
      - name: Stop clockbound
        if: always()
        run: |
          if [ -f /tmp/clockbound.pid ]; then
            sudo kill "$(cat /tmp/clockbound.pid)" 2>/dev/null || true
          fi

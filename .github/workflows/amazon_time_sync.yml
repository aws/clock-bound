name: Amazon Time Sync

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo build
        run: cargo build --bin amazon-time-sync-test --release

      - name: Upload amazon-time-sync-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazon-time-sync-test
          path: target/release/amazon-time-sync-test

  Amazon-Time-Sync_Tests:
    name: Amazon Time Sync Tests
    needs: build
    runs-on:
      - codebuild-${{ vars.PHC_X86_FLEET }}-${{ github.run_id }}-${{ github.run_attempt }}
        buildspec-override:true

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v5
        with:
          name: amazon-time-sync-test

      - run: ls
      - run: echo "Change permissions of artifact."
      - run: chmod 755 amazon-time-sync-test
      - run: echo "Run Amazon Time Sync test!"
      - run: ./amazon-time-sync-test

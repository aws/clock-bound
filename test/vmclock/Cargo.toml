[package]
name = "vmclock"
description = "A test program that attempts to sample from the vmclock shared memory file."
license = "Apache-2.0"
publish = false

authors.workspace = true
categories.workspace = true
edition.workspace = true
exclude.workspace = true
keywords.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "vmclock-test"
path = "src/main.rs"

[dependencies]
clock-bound = { version = "3.0.0-alpha.0", path = "../../clock-bound", features = [
  "daemon",
] }
rand = "0.9.2"
tokio = { version = "1.47.1", features = ["macros", "rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }

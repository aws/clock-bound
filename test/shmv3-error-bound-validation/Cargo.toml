[package]
name = "shmv3-error-bound-validation"
description = "Integration test: validates ClockBound SHM error bounds contain the chrony-disciplined system clock."
license = "Apache-2.0"
publish = false

authors.workspace = true
categories.workspace = true
edition.workspace = true
exclude.workspace = true
keywords.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "shmv3-error-bound-validation"
path = "src/main.rs"

[dependencies]
clock-bound = { path = "../../clock-bound", features = ["client"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.26", features = ["time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
